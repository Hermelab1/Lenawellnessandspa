<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B2545" />
    <meta name="color-scheme" content="light" />
    <title>Lena Wellness &amp; Spa | Rejuvenate Body, Mind &amp; Soul</title>
    <meta
      name="title"
      content="Lena Wellness &amp; Spa | Rejuvenate Body, Mind &amp; Soul"
    />
    <meta
      name="description"
      content="Escape to Lena Wellness &amp; Spa — a sanctuary of calm offering premium massages, facials, wellness packages and gift vouchers. Book your moment of serenity today."
    />
    <meta
      name="keywords"
      content="Lena Wellness & Spa, spa, wellness, massage, facial, aromatherapy, wellness packages, gift vouchers, beauty treatments, relaxation"
    />
    <meta name="author" content="Lena Wellness &amp; Spa" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%PUBLIC_URL%/" />

    <!-- Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%PUBLIC_URL%/" />
    <meta property="og:site_name" content="Lena Wellness &amp; Spa" />
    <meta
      property="og:title"
      content="Lena Wellness &amp; Spa | Rejuvenate Body, Mind &amp; Soul"
    />
    <meta
      property="og:description"
      content="A sanctuary of calm offering premium massages, facials, wellness packages and gift vouchers. Book your moment of serenity today."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:image:alt" content="Lena Wellness & Spa" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%PUBLIC_URL%/" />
    <meta
      name="twitter:title"
      content="Lena Wellness &amp; Spa | Rejuvenate Body, Mind &amp; Soul"
    />
    <meta
      name="twitter:description"
      content="A sanctuary of calm offering premium massages, facials, wellness packages and gift vouchers."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- Fonts (serif headings + sans body, matching the UI design) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Inline critical styles for fast first paint -->
    <style>
      :root {
        --brand-navy: #0b2545;
        --brand-lime: #a3e635;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: var(--brand-navy);
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Match the serif look used by section titles */
      h1,
      h2,
      h3,
      .font-serif {
        font-family: "Cormorant Garamond", "Times New Roman", Georgia, serif;
      }
      /* Initial loader – removed when React mounts */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #initial-loader .spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 4px solid rgba(11, 37, 69, 0.15);
        border-top-color: var(--brand-lime);
        animation: lw-spin 0.9s linear infinite;
      }
      #initial-loader .brand {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: var(--brand-navy);
      }
      #initial-loader .brand span {
        color: var(--brand-lime);
      }
      @keyframes lw-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div
        style="
          font-family: Inter, sans-serif;
          background: #0b2545;
          color: #fff;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 24px;
        "
      >
        <h1
          style="
            color: #a3e635;
            font-family: &quot;Cormorant Garamond&quot;, serif;
            font-size: 32px;
            margin: 0 0 12px;
          "
        >
          Lena Wellness &amp; Spa
        </h1>
        <p style="max-width: 480px; line-height: 1.6; opacity: 0.85; margin: 0">
          For the best experience on our website, please enable JavaScript in
          your browser. You can also
          <a
            href="https://enable-javascript.com/"
            style="color: #a3e635; text-decoration: underline"
            >learn how to enable it</a
          >.
        </p>
      </div>
    </noscript>

    <!-- Initial loader shown until React mounts -->
    <div id="initial-loader" aria-hidden="true">
      <div class="spinner"></div>
      <div class="brand">Lena <span>Wellness</span> &amp; Spa</div>
    </div>

    <div id="root"></div>

    <!--
      This HTML file is a template.
      The build step will place the bundled scripts into the <body> tag.
    -->
    <script>
      // Hide the initial loader once the app renders
      window.addEventListener("load", function () {
        var loader = document.getElementById("initial-loader");
        if (!loader) return;
        // Small delay so the spinner doesn't flash on fast loads
        setTimeout(function () {
          loader.style.opacity = "0";
          setTimeout(function () {
            loader.remove();
          }, 400);
        }, 250);
      });
    </script>
  </body>
</html>
